name: nested_game
description: "Nested — three tic-tac-toe variants: Stack-Static, Stack-Movable, and Ultimate."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  audioplayers: ^6.7.1
  firebase_analytics: ^12.4.5
  firebase_core: ^4.12.1
  firebase_crashlytics: ^5.2.6
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_svg: ^2.3.0
  google_mobile_ads: ^9.0.0
  in_app_purchase: ^3.3.0
  intl: any
  meta: ^1.17.0
  sentry_flutter: ^8.14.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # Declared as a directory, so dropping a new image in needs no pubspec edit
  # — only a matching constant in lib/theme/app_assets.dart.
  assets:
    - assets/images/
    - assets/svgs/
    - assets/chips/

  # Bricolage Grotesque (design system §2.2), bundled rather than fetched at
  # runtime. Static instances from the upstream project, SIL OFL 1.1 —
  # licence text ships in assets/fonts/OFL.txt. Only these four weights are
  # bundled; add ExtraLight/Light/ExtraBold from the same source if a design
  # ever calls for them.
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Regular.ttf
          weight: 400
        - asset: assets/fonts/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
