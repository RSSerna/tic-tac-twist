name: nested_game
description: "Nested — three tic-tac-toe variants: Stack-Static, Stack-Movable, and Ultimate."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  audioplayers: ^6.7.1
  firebase_analytics: ^12.4.5
  firebase_core: ^4.12.1
  firebase_crashlytics: ^5.2.6
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  google_mobile_ads: ^9.0.0
  in_app_purchase: ^3.3.0
  intl: any
  meta: ^1.17.0
  sentry_flutter: ^8.14.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
